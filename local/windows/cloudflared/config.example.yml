tunnel: <your-tunnel-uuid>
credentials-file: /etc/cloudflared/<your-tunnel-uuid>.json

ingress:
  - hostname: n8n-mcp.example.com
    path: '^/(\.well-known/.*|mcp-server/.*|mcp-oauth/.*|oauth/consent.*|signin.*|rest/.*|assets/.*|favicon\.ico|.*\.(js|css|png|svg|ico|woff2?))$'
    service: http://n8n:5678
  - service: http_status:404
